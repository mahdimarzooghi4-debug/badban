[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "badban"
version = "0.1.0"
description = "Badban bounded external-lender pilot foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "PyJWT[crypto]>=2.10,<3",
  "nats-py>=2.9,<3",
  "opentelemetry-api>=1.28,<2",
  "opentelemetry-instrumentation-fastapi>=0.49b0,<1",
  "opentelemetry-sdk>=1.28,<2",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.115,<7",
  "pip-audit>=2.7,<3",
  "pyright>=1.1.390,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
markers = ["integration: requires local PostgreSQL and/or NATS"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
