services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: badban
      POSTGRES_DB: badban
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U badban -d badban"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - badban_postgres:/var/lib/postgresql/data

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

volumes:
  badban_postgres:
