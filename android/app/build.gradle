plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.badban.preview'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.badban.preview'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0-preview'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
