name: Android Preview APK

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v4

      - name: Verify preview-only security invariants
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          root = pathlib.Path("android")
          source = (root / "app/src/main/java/ir/badban/preview/MainActivity.java").read_text()
          manifest = ET.parse(root / "app/src/main/AndroidManifest.xml").getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          permissions = [p.attrib[android + "name"] for p in manifest.findall("uses-permission")]
          assert permissions == ["android.permission.INTERNET"], permissions
          application = manifest.find("application")
          assert application is not None
          assert application.attrib[android + "allowBackup"] == "false"
          assert application.attrib[android + "usesCleartextTraffic"] == "false"
          assert 'Uri.parse("https://badban-ui-preview.onrender.com/")' in source
          assert "setAllowFileAccess(false)" in source
          assert "setAllowContentAccess(false)" in source
          assert "setAcceptThirdPartyCookies(webView, false)" in source
          assert "setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW)" in source
          assert "handler.cancel()" in source
          assert "addJavascriptInterface" not in source
          assert "handler.proceed()" not in source
          assert "BADBAN_OIDC" not in source
          assert "POST /api/" not in source
          assert "start-dev" not in source
          print("Preview-only security invariants: PASS")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK command-line tools
        uses: android-actions/setup-android@v3

      - name: Install build SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug-signed preview APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK package and checksum
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -n 1
          aapt dump badging "$APK" | grep -F "package: name='ir.badban.preview'"
          sha256sum "$APK"

      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: badban-android-preview-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
