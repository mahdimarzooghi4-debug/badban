name: Web Candidate CI

on:
  pull_request:
    paths:
      - "web/**"
      - "Dockerfile.render-stage"
      - "src/badban/api/web_adapter.py"
      - "src/badban/config.py"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "Dockerfile.render-stage"
      - "src/badban/api/web_adapter.py"
      - "src/badban/config.py"
      - ".github/workflows/web.yml"

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Unit tests
        working-directory: web
        run: npm test
      - name: Type-check and build
        working-directory: web
        run: npm run build
      - name: Build combined Stage image (validation only; no deploy)
        run: docker build -f Dockerfile.render-stage -t badban-stage-candidate:${{ github.sha }} .
