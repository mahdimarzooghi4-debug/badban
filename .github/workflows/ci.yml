name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: badban
          POSTGRES_DB: badban
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U badban -d badban"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20

    env:
      BADBAN_APP_ENV: test
      BADBAN_DATABASE_URL: postgresql+asyncpg://badban@localhost:5432/badban
      BADBAN_NATS_URL: nats://localhost:4222
      BADBAN_LOG_LEVEL: INFO
      BADBAN_OTEL_SERVICE_NAME: badban-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Start NATS JetStream
        run: |
          docker run -d --name badban-nats -p 4222:4222 nats:2.10-alpine -js
          sleep 2
          python -m badban.worker --check

      - name: Format
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: pyright

      - name: Apply migrations
        run: alembic upgrade head

      - name: Migration drift check
        run: alembic check

      - name: Tests
        run: pytest

      - name: Dependency audit
        run: pip-audit

      - name: Container build
        run: docker build -t badban:${{ github.sha }} .
